# Apache vhost for Pocket Money. TLS: run `certbot --apache -d pmoney.hups.club`
# after first deploy — certbot rewrites this vhost for :443 automatically.
<VirtualHost *:80>
    ServerName pmoney.hups.club

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8001/
    ProxyPassReverse / http://127.0.0.1:8001/

    ErrorLog ${APACHE_LOG_DIR}/pmoney-error.log
    CustomLog ${APACHE_LOG_DIR}/pmoney-access.log combined
</VirtualHost>
