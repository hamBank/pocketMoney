name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Settings refuses the default JWT_SECRET with auth on (fleet spec
      # CFG-2); alembic only needs the DB, so run it with auth off.
      - run: alembic upgrade head
        env: { AUTH_ENABLED: "false" }
      - run: alembic check  # models and migrations agree
        env: { AUTH_ENABLED: "false" }
      - run: pytest

  # Fleet spec DB-3/DB-4: migrations and the whole suite on real Postgres, since
  # dialect bugs (FKs, JSON, enums, timestamptz) pass on SQLite.
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pmoney_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTH_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/pmoney_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/pmoney_ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # hamBank/fleetSpec conformance, pinned to the spec version .fleet-spec.yml
  # declares. Needs the FLEETSPEC_TOKEN secret while fleetSpec is private.
  fleet-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: spec
        run: echo "version=$(awk '/^spec:/ {print $2}' .fleet-spec.yml)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: hamBank/fleetSpec
          ref: v${{ steps.spec.outputs.version }}
          path: .fleetspec
          token: ${{ secrets.FLEETSPEC_TOKEN || github.token }}
      - run: pip install pyyaml
      - run: python .fleetspec/conformance/check.py --app . --summary "$GITHUB_STEP_SUMMARY"
